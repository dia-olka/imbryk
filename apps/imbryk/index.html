<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Imbryk — Shape the World</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="What will the world’s most powerful AI systems predict when your event reshapes civilisation? Submit a scenario and read the coverage from six ideologically distinct AI newspapers."
    />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="canonical" href="https://imbryk.pages.dev/" />

    <!-- favicon as svg -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social meta -->
    <meta property="og:site_name" content="Imbryk" />
    <meta property="og:title" content="Imbryk — Shape the World" />
    <meta
      property="og:description"
      content="What will the world’s most powerful AI systems predict when your event reshapes civilisation? Submit a scenario and read the coverage from six ideologically distinct AI newspapers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://imbryk.pages.dev/" />
    <!-- TODO: create a 1200×630 OG image and place it in public/og-image.png -->
    <meta property="og:image" content="https://imbryk.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Imbryk — Shape the World: AI-powered newspapers covering your world-altering events"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Imbryk — Shape the World" />
    <meta
      name="twitter:description"
      content="What will the world’s most powerful AI systems predict when your event reshapes civilisation? Submit a scenario and read the coverage from six ideologically distinct AI newspapers."
    />
    <meta
      name="twitter:image"
      content="https://imbryk.pages.dev/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Imbryk — Shape the World: AI-powered newspapers covering your world-altering events"
    />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Imbryk",
        "url": "https://imbryk.pages.dev/",
        "description": "Submit world-altering events and read coverage from six ideologically distinct AI newspaper personas, each powered by advanced AI systems that predict how your event will reshape civilisation.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "1.00",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-bg text-text font-serif m-0 overflow-y-auto">
    <!-- application container handles full-height layout -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
