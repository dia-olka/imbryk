<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Imbryk — Six Papers, One Story</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Request coverage of any topic and read how six ideologically distinct AI newspapers report on it — same facts, six different front pages."
    />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="canonical" href="%VITE_APP_URL%/" />

    <!-- favicon as svg -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social meta -->
    <meta property="og:site_name" content="Imbryk" />
    <meta property="og:title" content="Imbryk — Six Papers, One Story" />
    <meta
      property="og:description"
      content="Request coverage of any topic and read how six ideologically distinct AI newspapers report on it — same facts, six different front pages."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <!-- TODO: create a 1200×630 OG image and place it in public/og-image.png -->
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Imbryk — AI-powered newspapers covering the topics you care about"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Imbryk — Six Papers, One Story" />
    <meta
      name="twitter:description"
      content="Request coverage of any topic and read how six ideologically distinct AI newspapers report on it — same facts, six different front pages."
    />
    <meta
      name="twitter:image"
      content="%VITE_APP_URL%/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Imbryk — AI-powered newspapers covering the topics you care about"
    />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Imbryk",
        "url": "%VITE_APP_URL%/",
        "description": "Request coverage of any topic and read how six ideologically distinct AI newspaper personas report on it — same real-world news, six different editorial lenses.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "1.00",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-bg text-text font-serif m-0 overflow-y-auto">
    <!-- application container handles full-height layout -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
