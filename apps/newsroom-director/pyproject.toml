[tool.coverage.run]
branch = true
source = [ "newsroom_director" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/newsroom-director/html'
 --cov-report xml:'../../coverage/apps/newsroom-director/coverage.xml'
 --html='../../reports/apps/newsroom-director/unittests/html/index.html'
 --junitxml='../../reports/apps/newsroom-director/unittests/junit.xml'
"""

[project]
name = "newsroom-director"
version = "1.0.0"
description = "Imbryk Morning Press - AI newspaper generation orchestrator"
requires-python = ">=3.12,<4"
readme = 'README.md'
dependencies = [
    "google-genai>=1.0.0",
    "hdbscan>=0.8.41",
    "numpy>=1.24,<2",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=5.1.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "torch>=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.1,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.45,<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "boto3>=1.35.0",
    "sentry-sdk>=2.0.0",
    "pg8000>=1.31.0",
    "tavily-python>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["newsroom_director"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
# some inspections are very noisy or not actionable in CI; ignoring helps the
# `lint` target succeed until code can be cleaned up properly.
ignore = [
  "E501",  # long lines (wrapped manually when editing the code base)
  "UP017", # datetime.UTC alias suggestion
  "B905",  # zip() strict parameter
  "UP035", # import from collections.abc
  "UP047", # generic function should use type params
]

fixable = ["ALL"]
unfixable = []
