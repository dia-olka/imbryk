name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  checks: write       # Playwright github reporter posts check annotations

jobs:
  js:
    name: JavaScript (lint, test, build, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx run-many --targets=lint,test,build,typescheck --all --exclude=ingestion-api,newsroom-director

  python:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install ingestion-api dependencies
        working-directory: apps/ingestion-api
        run: uv pip install --system ".[dev]" 2>/dev/null || uv pip install --system .

      - name: Install newsroom-director dependencies
        working-directory: apps/newsroom-director
        run: uv pip install --system ".[dev]" 2>/dev/null || uv pip install --system .

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx run-many --targets=lint,test --projects=ingestion-api,newsroom-director

  e2e:
    name: Playwright E2E — ${{ matrix.app }} (Chromium)
    needs: [js]
    runs-on: ubuntu-latest
    permissions:
      actions: write  # upload-artifact
      checks: write   # github reporter annotations
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: imbryk
            project: imbryk-e2e
            report-path: apps/imbryk-e2e/playwright-report/
          - app: gazette
            project: gazette-e2e
            report-path: apps/gazette-e2e/playwright-report/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx nx run ${{ matrix.project }}:e2e:ci

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}-ci
          path: ${{ matrix.report-path }}
          retention-days: 14

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [js, python]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Generate data for Docker build
        run: npx nx run ingestion-api:generate-data

      - name: Build ingestion-api image
        run: docker build -t imbryk/ingestion-api:ci -f apps/ingestion-api/Dockerfile apps/ingestion-api

      # newsroom-director build is skipped in CI — the sentence-transformers
      # model download makes it too slow for a CI check. It's validated
      # during manual deployment.
