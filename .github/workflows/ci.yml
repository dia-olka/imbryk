name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  js:
    name: JavaScript (lint, test, build, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check

      - run: npx nx affected -t lint test build typecheck

  python:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install ingestion-api dependencies
        working-directory: apps/ingestion-api
        run: uv pip install --system ".[dev]" 2>/dev/null || uv pip install --system .

      - name: Install newsroom-director dependencies
        working-directory: apps/newsroom-director
        run: uv pip install --system ".[dev]" 2>/dev/null || uv pip install --system .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint test --projects='ingestion-api,newsroom-director'

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [js, python]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build ingestion-api image
        run: docker build -t imbryk/ingestion-api:ci -f apps/ingestion-api/Dockerfile apps/ingestion-api

      # newsroom-director build is skipped in CI — the sentence-transformers
      # model download makes it too slow for a CI check. It's validated
      # during manual deployment.
