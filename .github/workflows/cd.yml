name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  VERTEX_AI_LOCATION: ${{ vars.VERTEX_AI_LOCATION || 'global' }}
  IMAGE_REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/imbryk

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation
  actions: write   # upload / download artifacts
  checks: write    # Playwright github reporter annotations

jobs:
  # Only run if CI succeeded
  gate:
    name: Check CI result
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed — proceeding with deployment"

  changes:
    name: Detect changed services
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      python-services: ${{ steps.filter.outputs.python-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # retrieve full history so we can compare against main or before

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # compare against the main branch (available in the checkout) rather than
          # relying on a non‑existent HEAD~1 ref in workflow_run builds
          base: main
          # head defaults to HEAD, which is fine
          filters: |
            python-services:
              - 'apps/ingestion-api/**'
              - 'apps/newsroom-director/**'
              - 'data/**'
              - 'scripts/generate-data.mjs'

  deploy-ingestion-api:
    name: Deploy ingestion-api
    needs: changes
    if: ${{ needs.changes.outputs.python-services == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Generate data from JSON
        run: npx nx run ingestion-api:generate-data

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/ingestion-api
          file: apps/ingestion-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/ingestion-api:latest
            ${{ env.IMAGE_REGISTRY }}/ingestion-api:${{ env.DEPLOY_SHA }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ingestion-api
          image: ${{ env.IMAGE_REGISTRY }}/ingestion-api:${{ env.DEPLOY_SHA }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            VERTEX_PROJECT=${{ vars.GCP_PROJECT_ID }}
            VERTEX_LOCATION=${{ env.VERTEX_AI_LOCATION }}
            CATEGORISER_MODEL=${{ vars.CATEGORISER_MODEL }}
          secrets: |
            STRIPE_SECRET_KEY=stripe-secret-key:latest
            STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest

      - name: Run database migrations
        run: |
          # Install Cloud SQL Proxy
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

          # Start proxy in the background
          ./cloud-sql-proxy "${{ vars.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:imbryk-db" --port 5432 &
          PROXY_PID=$!

          # Wait for proxy to be ready
          for i in $(seq 1 10); do
            if nc -z 127.0.0.1 5432 2>/dev/null; then break; fi
            sleep 1
          done

          # Install alembic and dependencies
          cd apps/ingestion-api
          python -m venv /tmp/migration-env
          source /tmp/migration-env/bin/activate
          pip install --quiet -e .

          # Run migrations
          DATABASE_URL="postgresql+pg8000://postgres:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/imbryk" \
            alembic upgrade head

          # Clean up proxy
          kill $PROXY_PID || true

  deploy-newsroom-director:
    name: Deploy newsroom-director
    needs: changes
    if: ${{ needs.changes.outputs.python-services == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Generate data from JSON
        run: npx nx run newsroom-director:generate-data

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/newsroom-director
          file: apps/newsroom-director/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/newsroom-director:latest
            ${{ env.IMAGE_REGISTRY }}/newsroom-director:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Cloud Run job
        run: |
          gcloud run jobs update newsroom-director \
            --image=${{ env.IMAGE_REGISTRY }}/newsroom-director:${{ env.DEPLOY_SHA }} \
            --region=${{ env.GCP_REGION }} \
            --update-env-vars=SENTRY_DSN=${{ vars.SENTRY_DSN }},R2_PUBLIC_URL=${{ vars.R2_PUBLIC_URL }},GENERATION_MODEL_PRO=${{ vars.GENERATION_MODEL_PRO }},GENERATION_MODEL_FLASH=${{ vars.GENERATION_MODEL_FLASH }},IMAGE_GENERATION_MODEL=${{ vars.IMAGE_GENERATION_MODEL }},VERTEX_AI_PROJECT=${{ vars.GCP_PROJECT_ID }},VERTEX_AI_LOCATION=${{ env.VERTEX_AI_LOCATION }} \
            --update-secrets=CF_DEPLOY_HOOK_URL=cf-deploy-hook-url:latest

  # ── Post-deployment E2E smoke tests ─────────────────────────────────────────
  # Runs after both deploy jobs (skipped deploys are fine — smoke tests still
  # validate that the live app is healthy after every CD run).
  #
  # 3 parallel workers × 5 browser/device projects (chromium, firefox, webkit,
  # mobile-chrome, mobile-safari).  Each worker writes a blob report to a
  # uniquely-named artifact so no results are ever overwritten.
  # The merge-e2e-reports job then combines all blobs into a single HTML report
  # and posts annotations directly to the workflow via the github reporter.
  #
  # Requires:  vars.IMBRYK_URL  — the deployed frontend base URL,
  #            e.g. https://app.imbryk.com
  e2e-shards:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [deploy-ingestion-api, deploy-newsroom-director]
    # Run even when individual deploy jobs were skipped (no relevant changes),
    # but abort if something actually failed or was cancelled.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/imbryk-e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.IMBRYK_URL }}
          PLAYWRIGHT_FULL_SUITE: 'true'

      # Each shard uploads its blob under a unique artifact name so parallel
      # workers never overwrite each other.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: apps/imbryk-e2e/blob-report/
          retention-days: 1   # blobs are only needed until merge-reports runs

  merge-e2e-reports:
    name: Merge E2E reports
    needs: [e2e-shards]
    if: always() && needs.e2e-shards.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - run: npm ci

      # Collect every blob from all three shards into ./all-blobs/
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-shard-*
          path: all-blobs
          merge-multiple: true

      # Merge blobs → HTML report (artifact) + github reporter (annotations
      # appear inline in the Actions log, no JSON parsing required).
      - name: Merge reports
        run: npx playwright merge-reports --reporter=github,html ./all-blobs
        working-directory: apps/imbryk-e2e
        env:
          CI: true

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cd
          path: apps/imbryk-e2e/playwright-report/
          retention-days: 30

      # Write a summary card so the result is visible at a glance on the
      # workflow run page without downloading the artifact.
      - name: Write step summary
        if: always()
        run: |
          STATUS="${{ needs.e2e-shards.result }}"
          if [ "$STATUS" = "success" ]; then
            echo "## ✅ E2E smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ E2E smoke tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3 shards · 5 devices (Chromium, Firefox, WebKit, Pixel 5, iPhone 13)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 [Download full HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
